name: Web Studio CI

on:
  push:
    branches: [main, "implementation/**", "integration/**"]
    paths:
      - "apps/web/**"
      - "docs/adr/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "docs/adr/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read
jobs:
  unit-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install pinned web dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    needs: unit-build
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install pinned web dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser contract tests
        run: npm run test:e2e
