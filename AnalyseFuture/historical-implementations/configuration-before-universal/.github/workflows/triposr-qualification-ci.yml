name: TripoSR Qualification CI

on:
  push:
    branches: [main, "implementation/**"]
    paths:
      - "services/generation/triposr_candidate/**"
      - ".github/workflows/triposr-qualification-ci.yml"
      - "docs/FIRST_REAL_GPU_RUNBOOK.md"
      - "docs/IMPLEMENTATION_CHECKLIST.md"
      - "docs/CODEX_HANDOFF.md"
  pull_request:
    paths:
      - "services/generation/triposr_candidate/**"
      - ".github/workflows/triposr-qualification-ci.yml"
      - "docs/FIRST_REAL_GPU_RUNBOOK.md"
      - "docs/IMPLEMENTATION_CHECKLIST.md"
      - "docs/CODEX_HANDOFF.md"

jobs:
  source-patch-and-cpu-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test harness
        run: python -m pip install pytest==9.0.2
      - name: Unit-test fail-closed preparation helpers
        run: python -m pytest -q services/generation/triposr_candidate/test_prepare_runtime.py
      - name: Clone exact reviewed TripoSR source
        run: |
          git clone --filter=blob:none https://github.com/VAST-AI-Research/TripoSR.git "$RUNNER_TEMP/TripoSR"
          git -C "$RUNNER_TEMP/TripoSR" checkout 107cefdc244c39106fa830359024f6a2f1c78871
      - name: Apply Build3D qualification patchset
        run: |
          python services/generation/triposr_candidate/prepare_runtime.py             --source-dir "$RUNNER_TEMP/TripoSR"             --output-dir "$RUNNER_TEMP/TripoSR-build3d"
      - name: Compile patched source without importing GPU dependencies
        run: |
          python -m compileall -q "$RUNNER_TEMP/TripoSR-build3d/tsr" "$RUNNER_TEMP/TripoSR-build3d/run.py"
      - name: Confirm hidden-download and blocked dependencies are absent
        run: |
          ! grep -R "from torchmcubes\|git+https://github.com/tatsy/torchmcubes" "$RUNNER_TEMP/TripoSR-build3d"
          ! grep -E "^(rembg|gradio)([=<>]|$)" "$RUNNER_TEMP/TripoSR-build3d/requirements-build3d.txt"
          ! grep -R "hf_hub_download(" "$RUNNER_TEMP/TripoSR-build3d/tsr"
      - name: Resolve qualification direct dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --dry-run --ignore-installed             -r services/generation/triposr_candidate/requirements-build3d.txt
      - name: Install CPU marching-cubes test dependencies
        run: python -m pip install numpy==1.26.4 scikit-image==0.25.2
      - name: Test marching-cubes axis and winding contract
        run: python -m pytest -q services/generation/triposr_candidate/test_marching_cubes_contract.py
