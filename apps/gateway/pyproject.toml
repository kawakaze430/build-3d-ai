[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "build3d-gateway"
version = "0.1.0"
description = "Authenticated integration gateway for real self-hosted 3D generation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
build3d_gateway = ["model-approvals.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
