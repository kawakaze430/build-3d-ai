# Private CPU services only. A GPU backend must be separately approved/configured.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: build3d
      POSTGRES_USER: build3d
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private URL-safe PostgreSQL password}
    volumes:
      - product-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U build3d -d build3d"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port: database stays on the private Compose network.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://build3d:${POSTGRES_PASSWORD}@db:5432/build3d
      ARTIFACT_DIR: /var/lib/build3d/artifacts
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - product-artifacts:/var/lib/build3d/artifacts
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
  worker:
    profiles: [gpu]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://build3d:${POSTGRES_PASSWORD}@db:5432/build3d
      ARTIFACT_DIR: /var/lib/build3d/artifacts
    volumes:
      - product-artifacts:/var/lib/build3d/artifacts
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    # Safe default. Only an explicit run command can acknowledge GPU spending.
    command: ["build3d-worker", "--help"]
volumes:
  product-db:
  product-artifacts:
