name: Web Studio CI

on:
  push:
    branches: [main, "implementation/**", "integration/**"]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "apps/gateway/**"
      - "requirements.lock"
      - "docs/architecture/adr/**"
      - "scripts/cloud/install.sh"
      - "scripts/cloud/run_web.py"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "apps/gateway/**"
      - "requirements.lock"
      - "docs/architecture/adr/**"
      - "scripts/cloud/install.sh"
      - "scripts/cloud/run_web.py"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read
jobs:
  unit-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Install locked web dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    needs: unit-build
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Install locked web dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser contract tests
        run: npm run test:e2e

  real-api-browser:
    runs-on: ubuntu-latest
    needs: unit-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned CPU dependencies
        run: python -m pip install -c requirements.lock -e ./apps/gateway -e ./apps/api
      - name: Install locked web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance against the real product API
        run: python apps/web/tests/real-api/run.py
